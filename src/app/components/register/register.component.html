<section class="auth-wrap">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p class="subtitle">Set your monthly budget goal and get started.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label>Full Name</label>
      <input type="text" formControlName="name" placeholder="Francis Okafor" />

      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com" />

      <label>Password</label>
      <input type="password" formControlName="password" placeholder="At least 6 characters" />

      <label>Budget Goal</label>
      <input type="number" formControlName="budgetGoal" min="0" placeholder="500000" />

      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

      <button class="google-btn" type="button" [disabled]="loading" (click)="onGoogleRegister()">
        {{ loading ? 'Please wait...' : 'Continue with Google' }}
      </button>
    </form>

    <p class="note">You can create an account with Email/Password or Google.</p>

    @if (success) {
      <p class="success">{{ success }}</p>
    }

    @if (error) {
      <p class="error">{{ error }}</p>
    }
    <p class="link-text">Already registered? <a routerLink="/login">Sign in</a></p>
  </div>
</section>
